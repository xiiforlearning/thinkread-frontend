<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ThinkRead · Дашборд</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- The dashboard is also opened inside the Telegram Mini App: the SDK reports the safe areas
         under Telegram's own header, so our top bar and drawer can stay clear of it. -->
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount; stays visible when the script never ran. -->
      <p id="boot" style="font-family: system-ui; padding: 48px 24px; opacity: 0.7">
        Загружаю дашборд… Если надпись не исчезает, обновите страницу (Ctrl+Shift+R).
      </p>
    </div>
    <script>
      // A page kept from before a deploy points at a hashed chunk that is gone from the server:
      // reload once with a cache-busting query, keeping the route hash. Otherwise say what failed.
      function reloadFresh() {
        try {
          if (sessionStorage.getItem('tr.reloaded')) return false;
          sessionStorage.setItem('tr.reloaded', '1');
        } catch (err) {
          /* storage may be blocked — then only the message below */
        }
        var u = new URL(location.href);
        u.searchParams.set('v', String(Date.now()));
        location.replace(u.toString());
        return true;
      }
      window.addEventListener('error', function (e) {
        var src = e.target && e.target.src;
        if (src && String(src).indexOf('/assets/') !== -1 && reloadFresh()) return;
        var boot = document.getElementById('boot');
        if (!boot) return;
        var what = e.message || (src ? 'не загрузился ' + src : 'ошибка');
        boot.textContent = 'Дашборд не запустился: ' + what + ' — обновите страницу (Ctrl+Shift+R). Если повторяется, пришлите этот текст разработчику.';
      }, true);
      window.addEventListener('vite:preloadError', function (e) {
        if (reloadFresh()) e.preventDefault();
      });
      window.addEventListener('load', function () {
        try {
          sessionStorage.removeItem('tr.reloaded');
        } catch (err) {
          /* ignore */
        }
      });
    </script>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
