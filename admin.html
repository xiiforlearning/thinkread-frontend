<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ThinkRead · Дашборд</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount; stays visible when the script never ran. -->
      <p id="boot" style="font-family: system-ui; padding: 48px 24px; opacity: 0.7">
        Загружаю дашборд… Если надпись не исчезает, обновите страницу (Ctrl+Shift+R).
      </p>
    </div>
    <script>
      // A script that failed to load or threw before React mounted: say so instead of a blank page.
      window.addEventListener('error', function (e) {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var what = e.message || (e.target && e.target.src ? 'не загрузился ' + e.target.src : 'ошибка');
        boot.textContent = 'Дашборд не запустился: ' + what + ' — обновите страницу (Ctrl+Shift+R). Если повторяется, пришлите этот текст разработчику.';
      }, true);
    </script>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
